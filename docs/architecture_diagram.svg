<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293d" stroke-width="2"/>

  <!-- Title -->
  <text x="480" y="42" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    TCP Dumbbell Simulation Topology &amp; Under-The-Hood Architecture
  </text>
  <text x="480" y="65" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">
    Tahoe (RFC 2001) | Reno (RFC 5681) | NewReno (RFC 6582) | Cubic (RFC 8312)
  </text>

  <!-- Access Link 1 -->
  <line x1="140" y1="180" x2="360" y2="180" stroke="#334155" stroke-width="4"/>
  <text x="250" y="165" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Access Link: 100 Mbps, 2ms</text>

  <!-- Bottleneck Link -->
  <line x1="360" y1="180" x2="600" y2="180" stroke="#f59e0b" stroke-width="8" filter="url(#glow)"/>
  <text x="480" y="160" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">
    BOTTLENECK: 10 Mbps, 20ms (DropTail Queue)
  </text>

  <!-- Access Link 2 -->
  <line x1="600" y1="180" x2="820" y2="180" stroke="#334155" stroke-width="4"/>
  <text x="710" y="165" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">Access Link: 100 Mbps, 2ms</text>

  <!-- Reverse ACK path -->
  <path d="M 820 220 Q 480 300 140 220" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="480" y="285" fill="#10b981" font-family="monospace" font-size="11" text-anchor="middle">
    Reverse Channel: Cumulative &amp; Duplicate ACKs
  </text>

  <!-- Sender Node (H1) -->
  <g transform="translate(140, 180)">
    <circle r="36" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3"/>
    <text y="-8" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Sender</text>
    <text y="10" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">H1: 10.1.1.1</text>
    <text y="54" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">[TCP Stack: cwnd]</text>
  </g>

  <!-- Router 1 (R0) -->
  <g transform="translate(360, 180)">
    <circle r="32" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="3"/>
    <text y="-6" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Router 1</text>
    <text y="10" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">R0: 10.1.2.1</text>
  </g>

  <!-- Bottleneck Queue Box -->
  <g transform="translate(410, 195)">
    <rect width="140" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect width="70" height="24" rx="4" fill="#38bdf8" opacity="0.4"/>
    <text x="70" y="16" fill="#f8fafc" font-family="monospace" font-size="10" text-anchor="middle">FIFO Queue: 50 pkts</text>
  </g>

  <!-- Router 2 (R1) -->
  <g transform="translate(600, 180)">
    <circle r="32" fill="#0f172a" stroke="url(#purpleGrad)" stroke-width="3"/>
    <text y="-6" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Router 2</text>
    <text y="10" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">R1: 10.1.2.2</text>
  </g>

  <!-- Receiver Node (H2) -->
  <g transform="translate(820, 180)">
    <circle r="36" fill="#0f172a" stroke="url(#greenGrad)" stroke-width="3"/>
    <text y="-8" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Receiver</text>
    <text y="10" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">H2: 10.1.3.1</text>
    <text y="54" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">[TCP Sink: rwnd]</text>
  </g>

  <!-- Interactive Inspector Pill -->
  <g transform="translate(480, 340)">
    <rect x="-180" y="-14" width="360" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text y="4" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
      💡 Interactive: Click nodes, queue, or packets to inspect internal state
    </text>
  </g>
</svg>

